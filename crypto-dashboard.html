<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .stats-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-weight: 600;
            color: #666;
        }
        
        .stat-value {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .positive {
            color: #10b981;
        }
        
        .negative {
            color: #ef4444;
        }
        
        .crypto-table {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .table-title {
            font-size: 1.5rem;
            color: #333;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .crypto-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e9ecef;
            transition: all 0.3s;
        }
        
        .crypto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .crypto-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .crypto-symbol {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .crypto-price {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .crypto-change {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2rem;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        
        .success {
            background: #efe;
            color: #363;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Crypto Trading Dashboard</h1>
            <p>Real-time cryptocurrency market data</p>
        </div>
        
        <div class="dashboard">
            <div class="stats-card">
                <div class="stats-title">📊 Market Overview</div>
                <div id="market-stats">
                    <div class="loading">Loading market data...</div>
                </div>
            </div>
            
            <div class="crypto-table">
                <div class="table-header">
                    <div class="table-title">💰 Top Cryptocurrencies</div>
                    <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
                </div>
                <div id="crypto-list">
                    <div class="loading">Loading cryptocurrency data...</div>
                </div>
            </div>
        </div>
        
        <div id="status-message"></div>
    </div>

    <script>
        let marketStats = {};
        let cryptocurrencies = [];
        
        async function loadData() {
            try {
                showStatus('🔄 Loading data...', 'loading');
                
                // Load market stats
                const statsResponse = await fetch('http://localhost:5000/api/market/stats');
                if (statsResponse.ok) {
                    marketStats = await statsResponse.json();
                    displayMarketStats();
                }
                
                // Load cryptocurrencies
                const cryptoResponse = await fetch('http://localhost:5000/api/market/cryptocurrencies');
                if (cryptoResponse.ok) {
                    cryptocurrencies = await cryptoResponse.json();
                    displayCryptocurrencies();
                    showStatus('✅ Data loaded successfully!', 'success');
                } else {
                    throw new Error('Failed to load cryptocurrency data');
                }
                
            } catch (error) {
                console.error('Error loading data:', error);
                showStatus('❌ Error loading data: ' + error.message, 'error');
            }
        }
        
        function displayMarketStats() {
            const statsContainer = document.getElementById('market-stats');
            statsContainer.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Total Market Cap</span>
                    <span class="stat-value">$${formatNumber(marketStats.total_market_cap || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">24h Volume</span>
                    <span class="stat-value">$${formatNumber(marketStats.total_volume || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Active Cryptocurrencies</span>
                    <span class="stat-value">${cryptocurrencies.length || 0}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Bitcoin Dominance</span>
                    <span class="stat-value">${marketStats.btcDominance || '57.3'}%</span>
                </div>
            `;
        }
        
        function displayCryptocurrencies() {
            const cryptoContainer = document.getElementById('crypto-list');
            const topCryptos = cryptocurrencies.slice(0, 6);
            
            cryptoContainer.innerHTML = `
                <div class="crypto-grid">
                    ${topCryptos.map(crypto => `
                    <div class="crypto-card">
                        <div class="crypto-name">${crypto.name}</div>
                        <div class="crypto-symbol">${crypto.symbol.toUpperCase()}</div>
                        <div class="crypto-price">$${formatPrice(crypto.current_price)}</div>
                        <div class="crypto-change ${(crypto.price_change_percentage_24h || 0) >= 0 ? 'positive' : 'negative'}">
                            ${(crypto.price_change_percentage_24h || 0) >= 0 ? '+' : ''}${(crypto.price_change_percentage_24h || 0).toFixed(2)}%
                        </div>
                    </div>
                `).join('')}
                </div>
            `;
        }
        
        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return num.toFixed(2);
        }
        
        function formatPrice(price) {
            if (price >= 1) return price.toFixed(2);
            if (price >= 0.01) return price.toFixed(4);
            return price.toFixed(8);
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 3000);
        }
        
        // Load data on page load
        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
