<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTrading - React Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@microsoft/signalr/dist/browser/signalr.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
        }
        
        .success {
            background: rgba(16, 185, 129, 0.2);
            border-left: 4px solid #10b981;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
        }
        
        .loading {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function CryptoTest() {
            const [testResults, setTestResults] = useState([]);
            const [isRunning, setIsRunning] = useState(false);

            const addResult = (test, status, message, data = null) => {
                setTestResults(prev => [...prev, {
                    test,
                    status,
                    message,
                    data,
                    timestamp: new Date().toLocaleTimeString()
                }]);
            };

            const runAllTests = async () => {
                setIsRunning(true);
                setTestResults([]);

                // Test 1: Market Data API
                try {
                    addResult("Market Data API", "loading", "Testing /api/market/cryptocurrencies...");
                    const marketResponse = await axios.get('http://localhost:5000/api/market/cryptocurrencies');
                    addResult("Market Data API", "success", `✅ Success - ${marketResponse.data.length} coins loaded`, 
                        `Bitcoin: $${marketResponse.data[0]?.current_price || 'N/A'}`);
                } catch (err) {
                    addResult("Market Data API", "error", `❌ Failed: ${err.message}`);
                }

                // Test 2: Market Stats API
                try {
                    addResult("Market Stats API", "loading", "Testing /api/market/stats...");
                    const statsResponse = await axios.get('http://localhost:5000/api/market/stats');
                    const stats = statsResponse.data;
                    addResult("Market Stats API", "success", "✅ Success", 
                        `Market Cap: $${(stats.total_market_cap/1e12).toFixed(2)}T, Volume: $${(stats.total_volume/1e9).toFixed(2)}B`);
                } catch (err) {
                    addResult("Market Stats API", "error", `❌ Failed: ${err.message}`);
                }

                // Test 3: Trading API
                try {
                    addResult("Trading API", "loading", "Testing /api/trading...");
                    const tradingResponse = await axios.get('http://localhost:5000/api/trading');
                    addResult("Trading API", "success", "✅ Success", tradingResponse.data.message);
                } catch (err) {
                    addResult("Trading API", "error", `❌ Failed: ${err.message}`);
                }

                // Test 4: Portfolio API
                try {
                    addResult("Portfolio API", "loading", "Testing /api/portfolio...");
                    const portfolioResponse = await axios.get('http://localhost:5000/api/portfolio');
                    addResult("Portfolio API", "success", "✅ Success", portfolioResponse.data.message);
                } catch (err) {
                    addResult("Portfolio API", "error", `❌ Failed: ${err.message}`);
                }

                // Test 5: Payment API
                try {
                    addResult("Payment API", "loading", "Testing /api/payment...");
                    const paymentResponse = await axios.get('http://localhost:5000/api/payment');
                    addResult("Payment API", "success", "✅ Success", paymentResponse.data.message);
                } catch (err) {
                    addResult("Payment API", "error", `❌ Failed: ${err.message}`);
                }

                // Test 6: SignalR Connection
                try {
                    addResult("SignalR Hub", "loading", "Testing SignalR connection...");
                    const connection = new signalR.HubConnectionBuilder()
                        .withUrl("http://localhost:5000/marketHub")
                        .build();
                    
                    await connection.start();
                    addResult("SignalR Hub", "success", "✅ Connected successfully");
                    await connection.stop();
                } catch (err) {
                    addResult("SignalR Hub", "error", `❌ Failed: ${err.message}`);
                }

                // Test 7: Auth Registration
                try {
                    addResult("Auth Registration", "loading", "Testing user registration...");
                    const testUser = {
                        email: `test${Date.now()}@example.com`,
                        password: "Test123456",
                        confirmPassword: "Test123456",
                        fullName: "Test User"
                    };
                    
                    const authResponse = await axios.post('http://localhost:5000/api/auth/register', testUser);
                    addResult("Auth Registration", "success", "✅ Registration successful", authResponse.data.message);
                } catch (err) {
                    if (err.response?.status === 400) {
                        addResult("Auth Registration", "success", "✅ Validation working (400 expected)", err.response.data.message || "Validation error");
                    } else {
                        addResult("Auth Registration", "error", `❌ Failed: ${err.message}`);
                    }
                }

                setIsRunning(false);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>🧪 CryptoTrading API Test Suite</h1>
                        <p>Comprehensive testing of all APIs and features</p>
                        <button onClick={runAllTests} disabled={isRunning}>
                            {isRunning ? "🔄 Running Tests..." : "▶️ Run All Tests"}
                        </button>
                    </div>

                    <div className="test-section">
                        <h2>📊 Test Results</h2>
                        {testResults.length === 0 && !isRunning && (
                            <div className="test-result loading">
                                Click "Run All Tests" to start testing all APIs
                            </div>
                        )}
                        
                        {testResults.map((result, index) => (
                            <div key={index} className={`test-result ${result.status}`}>
                                <strong>[{result.timestamp}] {result.test}:</strong> {result.message}
                                {result.data && <div style={{marginTop: '5px', fontSize: '0.9em', opacity: '0.8'}}>{result.data}</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CryptoTest />, document.getElementById('root'));
    </script>
</body>
</html>
